<style>
:root{--bg:#FFFFFF; --ink:#222222; --muted:#6A6A6A; --line:#E4E4E4; --surface:#F6F6F4; --accent:#0019A8; --err:#B3261E; color-scheme:light}
@media (prefers-color-scheme:dark){ :root{--bg:#141518; --ink:#EDEDED; --muted:#A8A8A8; --line:#2C2F35; --surface:#1C1E22; --accent:#8FA6FF; --err:#FF8A80; color-scheme:dark} }
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased}
main{width:100%; max-width:380px}
h1{font-size:34px; font-weight:800; letter-spacing:-.025em; margin:0 0 6px}
p.sub{margin:0 0 26px; color:var(--muted); font-size:15.5px; line-height:1.5}
label.pw{display:block; font-size:14px; font-weight:600; margin-bottom:8px}
.pwrap{position:relative}
input#pw{width:100%; height:50px; padding:0 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; font-size:17px; padding-right:52px}
.eye{position:absolute; top:3px; right:3px; width:44px; height:44px; border:0; border-radius:10px; background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center}
.eye:hover{color:var(--ink)}
.eye svg{width:22px; height:22px}
.eye .off{display:none} .eye[aria-pressed="true"] .on{display:none} .eye[aria-pressed="true"] .off{display:block}
input#pw:focus{outline:3px solid var(--accent); outline-offset:1px; border-color:transparent}
.keep{display:flex; align-items:center; gap:10px; margin:16px 0 20px; font-size:15px; cursor:pointer}
.keep input{width:20px; height:20px; margin:0; accent-color:var(--accent)}
#go{width:100%; height:50px; border:0; border-radius:999px; background:var(--ink); color:var(--bg); font:inherit; font-size:16px; font-weight:700; cursor:pointer}
#go:disabled{opacity:.6; cursor:progress}
.err{min-height:22px; margin:12px 0 0; color:var(--err); font-size:14.5px}
.loading{color:var(--muted); font-size:15px}
</style>
</head>

  <div id="loading" class="loading" hidden>Opening the itinerary…</div>
  <form id="form" hidden>

    <label class="pw" for="pw">Password</label>
    <div class="pwrap"><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
    </button></div>
    <label class="keep"><input id="keep" type="checkbox" checked>Keep me signed in on this device</label>
    <button id="go" type="submit">Open itinerary</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

4FjVaG+FLZFXv9m1i8jMvYNZFq6bowweBSA";
  const KEY_NAME = "londonTrip2026Key";
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = u => btoa(String.fromCharCode(...u));
  const $ = id => document.getElementById(id);
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY_NAME) || "null"); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY_NAME, JSON.stringify(v)); } catch {} },
    clear() { try { localStorage.removeItem(KEY_NAME); } catch {} }
  };
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, 256));
  }
  async function open(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
    const html = new TextDecoder().decode(plain);
    // Swap the page in place rather than document.write: phones forget the mobile viewport after document.open()
    const doc = new DOMParser().parseFromString(html, "text/html");
    const keep = "meta[charset], meta[name=viewport], meta[name=robots], meta[name=theme-color], link[rel~=icon], link[rel=apple-touch-icon]";
    document.documentElement.lang = doc.documentElement.lang || "en";
    [...document.head.children].forEach(n => { if (!n.matches(keep)) n.remove(); });
    [...doc.head.children].forEach(n => { if (!n.matches(keep)) document.head.append(document.importNode(n, true)); });
    document.title = doc.title;
    const body = document.importNode(doc.body, true);
    document.body.replaceWith(body);
    // imported scripts don't run, so recreate them in order
    body.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }
  function showForm(msg) {
    $("loading").hidden = true; $("form").hidden = false; $("err").textContent = msg || ""; $("pw").focus();
  }
  // signed in before on this device? (a new password has a new salt, which signs everyone out)
  const saved = store.get();
  if (saved && saved.salt === SALT) {
    $("loading").hidden = false;
    open(bytes(saved.key)).catch(() => { store.clear(); showForm(); });
  } else {
    store.clear(); showForm();
  }
  $("eye").addEventListener("click", () => {
    const show = $("pw").type === "password";
    $("pw").type = show ? "text" : "password";
    $("eye").setAttribute("aria-pressed", show);
    $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
    $("pw").focus();
  });
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const go = $("go"); go.disabled = true; go.textContent = "Checking…"; $("err").textContent = "";
    try {
      const raw = await derive($("pw").value);
      if ($("keep").checked) store.set({ salt: SALT, key: b64(raw) });
      await open(raw);
    } catch {
      store.clear();
      go.disabled = false; go.textContent = "Open itinerary";
      $("err").textContent = "That password didn't work. Check it and try again.";
      $("pw").select();
    }
  });
